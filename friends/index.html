<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链 — WafiLog</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #111;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 48px 0 0;
    text-align: center;
  }
  .site-title {
    display: inline-block;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 10px 28px;
    text-decoration: none;
    transition: opacity .2s;
  }
  .site-title:hover { opacity: .8; }
  nav {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 2px;
    font-size: 14px;
  }
  nav a {
    color: #888;
    text-decoration: none;
    padding: 6px 16px;
    transition: color .2s;
  }
  nav a:hover { color: #111; }
  nav a.active { color: #111; font-weight: 600; }

  /* Main */
  main {
    padding: 56px 0 80px;
  }

  .page-title {
    font-size: 13px;
    font-weight: 700;
    color: #bbb;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .page-subtitle {
    font-size: 14px;
    color: #ccc;
    margin-bottom: 40px;
  }

  /* Friend card grid */
  .friend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .friend-card {
    display: flex;
    flex-direction: column;
    padding: 24px;
    border: 1px solid #eee;
    transition: border-color .2s, box-shadow .2s;
  }
  .friend-card:hover {
    border-color: #ddd;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }

  .friend-card-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .friend-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #f5f5f5;
  }

  .friend-name {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    line-height: 1.3;
  }

  .friend-description {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 16px;
    flex: 1;
  }

  .friend-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #bbb;
    text-decoration: none;
    transition: color .2s;
    align-self: flex-start;
  }
  .friend-link:hover {
    color: #111;
  }
  .friend-link svg {
    width: 12px;
    height: 12px;
  }

  /* Apply section */
  .apply-section {
    margin-top: 56px;
    padding: 32px;
    background: #fafafa;
    text-align: center;
  }
  .apply-section h3 {
    font-size: 15px;
    font-weight: 700;
    color: #111;
    margin-bottom: 10px;
  }
  .apply-section p {
    font-size: 13px;
    color: #888;
    line-height: 1.7;
  }
  .apply-section code {
    display: inline-block;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 12px;
    background: #eee;
    padding: 2px 8px;
    margin-top: 6px;
    color: #333;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 32px 0 80px;
    font-size: 12px;
    color: #ccc;
    border-top: 1px solid #f5f5f5;
  }

  /* Sidebar */
  .sidebar-toggle {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 42px;
    height: 42px;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .2s;
    z-index: 100;
  }
  .sidebar-toggle:hover { opacity: .8; }
  .sidebar-toggle svg { width: 20px; height: 20px; }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar {
    position: fixed;
    top: 0;
    right: -300px;
    width: 280px;
    height: 100vh;
    background: #fff;
    border-left: 1px solid #eee;
    z-index: 300;
    transition: right .3s ease;
    padding: 40px 28px;
    overflow-y: auto;
  }
  .sidebar.open { right: 0; }

  .sidebar h3 {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .sidebar ul { list-style: none; }
  .sidebar li + li { border-top: 1px solid #f0f0f0; }
  .sidebar a {
    display: block;
    padding: 12px 0;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    transition: color .2s;
  }
  .sidebar a:hover { color: #111; }
  .sidebar a.active { color: #111; font-weight: 600; }

  .sidebar-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: #888;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .sidebar-close:hover { color: #111; }

  /* Mobile */
  @media (max-width: 520px) {
    header { padding-top: 32px; }
    .container { padding: 0 16px; }
    .friend-grid { grid-template-columns: 1fr; }
    .sidebar-toggle { bottom: 20px; right: 20px; }
    .sidebar { width: 260px; right: -260px; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="site-title">WAFILOG</a>
  <nav>
    <a href="/">首页</a>
    <a href="/archives/">归档</a>
    <a href="/friends/" class="active">友链</a>
  </nav>
</header>

<main class="container">
  <div class="page-title">友链</div>
  <div class="page-subtitle">朋友们</div>

  <div class="friend-grid" id="friendGrid">
    <div class="friend-card">
      <div class="friend-card-top">
        <img class="friend-avatar" src="https://blog.huanment.top/images/avatar.avif" alt="穗积的宇宙船" loading="lazy">
        <div class="friend-name">穗积的宇宙船</div>
      </div>
      <div class="friend-description">莫笑吾辈好远骛，跬步平川马蹄疾。</div>
      <a class="friend-link" href="https://blog.huanment.top" target="_blank" rel="noopener">
        blog.huanment.top
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
      </a>
    </div>
  </div>

  <div class="apply-section">
    <h3>交换友链</h3>
    <p>
      如需交换友链，请按以下格式发送给1942392307@qq.com<br>
    </p>
    <code id="templateCode">{
  "name": "你的博客名",
  "description": "一句话描述",
  "link": "https://example.com",
  "avatar": "https://example.com/avatar.png"
}</code>
  </div>
</main>

<footer class="container">
  WafiLog
</footer>

<!-- Sidebar Toggle -->
<button class="sidebar-toggle" id="sidebarToggle" aria-label="打开侧边栏">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="4" y1="6" x2="20" y2="6"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="18" x2="20" y2="18"/>
  </svg>
</button>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">✕</button>
  <h3>归档</h3>
  <ul>
    <li><a href="/archives/#2026-08">2026 年 8 月</a></li>
    <li><a href="/archives/#2026-07">2026 年 7 月</a></li>
  </ul>
</aside>

<script>
  const friends = [
    {
  "name": "穗积的宇宙船",
  "description": "莫笑吾辈好远骛，跬步平川马蹄疾。",
  "link": "https://blog.huanment.top",
  "avatar": "https://blog.huanment.top/images/avatar.avif"
    }
  ];

  const grid = document.getElementById('friendGrid');

  // 仅当网格为空（如禁用 JS 的静态降级未生效）时才动态渲染，
  // 避免与页面中已静态生成的内容重复。
  if (grid.children.length === 0) {
    friends.forEach(function(f) {
      const card = document.createElement('div');
      card.className = 'friend-card';

      card.innerHTML =
        '<div class="friend-card-top">' +
          '<img class="friend-avatar" src="' + f.avatar + '" alt="' + f.name + '" loading="lazy">' +
          '<div class="friend-name">' + f.name + '</div>' +
        '</div>' +
        '<div class="friend-description">' + f.description + '</div>' +
        '<a class="friend-link" href="' + f.link + '" target="_blank" rel="noopener">' +
          f.link.replace(/^https?:\/\//, '') +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>' +
        '</a>';

      grid.appendChild(card);
    });
  }
</script>

<script>
  (function() {
    var toggle = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var close = document.getElementById('sidebarClose');

    function open() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    toggle.addEventListener('click', open);
    close.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
  })();

  // 按钮点击音效
  (function() {
    var clickSound = new Audio('/resources/sounds/button15.wav');
    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        clickSound.currentTime = 0;
        clickSound.play().catch(function() {});
      }
    });
  })();
</script>

</body>
</html>
