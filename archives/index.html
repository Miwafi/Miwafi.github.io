<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="WafiLog 全部文章的归档页面，按月份整理发布过的所有文章。">
<title>归档 — WafiLog</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #111;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 48px 0 0;
    text-align: center;
  }
  .site-title {
    display: inline-block;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 10px 28px;
    text-decoration: none;
    transition: opacity .2s;
  }
  .site-title:hover { opacity: .8; }
  nav {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 2px;
    font-size: 14px;
  }
  nav a {
    color: #888;
    text-decoration: none;
    padding: 6px 16px;
    transition: color .2s;
  }
  nav a:hover { color: #111; }
  nav a.active { color: #111; font-weight: 600; }

  /* Main */
  main {
    padding: 56px 0 80px;
  }

  /* Page title */
  .page-title {
    font-size: 13px;
    font-weight: 700;
    color: #bbb;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 40px;
  }

  /* Year */
  .archive-year {
    margin-bottom: 48px;
  }
  .archive-year:last-child {
    margin-bottom: 0;
  }
  .year-heading {
    font-size: 28px;
    font-weight: 700;
    color: #111;
    margin-bottom: 24px;
    letter-spacing: .5px;
  }

  /* Month */
  .archive-month {
    margin-bottom: 32px;
  }
  .archive-month:last-child {
    margin-bottom: 0;
  }
  .month-heading {
    font-size: 16px;
    font-weight: 600;
    color: #555;
    margin-bottom: 16px;
    padding-left: 4px;
  }

  /* Entry */
  .archive-entry {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    transition: border-color .2s;
  }
  .archive-entry:hover {
    border-bottom-color: #ddd;
  }
  .archive-entry:last-child {
    border-bottom: none;
  }

  .archive-entry-date {
    flex-shrink: 0;
    font-size: 13px;
    color: #bbb;
    font-variant-numeric: tabular-nums;
    min-width: 48px;
  }

  .archive-entry-title {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }
  .archive-entry-title a {
    color: #111;
    text-decoration: none;
    transition: color .2s;
  }
  .archive-entry-title a:hover {
    color: #888;
  }

  .archive-entry-category {
    flex-shrink: 0;
    font-size: 11px;
    color: #bbb;
    background: #f8f8f8;
    padding: 2px 10px;
    border-radius: 2px;
    letter-spacing: .3px;
  }

  /* Stats */
  .archive-stats {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid #eee;
    text-align: center;
    font-size: 13px;
    color: #bbb;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 32px 0 80px;
    font-size: 12px;
    color: #ccc;
    border-top: 1px solid #f5f5f5;
  }

  /* Sidebar (same as homepage) */
  .sidebar-toggle {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 42px;
    height: 42px;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .2s;
    z-index: 100;
  }
  .sidebar-toggle:hover { opacity: .8; }
  .sidebar-toggle svg { width: 20px; height: 20px; }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.3);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar {
    position: fixed;
    top: 0;
    right: -300px;
    width: 280px;
    height: 100vh;
    background: #fff;
    border-left: 1px solid #eee;
    z-index: 300;
    transition: right .3s ease;
    padding: 40px 28px;
    overflow-y: auto;
  }
  .sidebar.open { right: 0; }

  .sidebar h3 {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .sidebar ul { list-style: none; }
  .sidebar li + li { border-top: 1px solid #f0f0f0; }
  .sidebar a {
    display: block;
    padding: 12px 0;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    transition: color .2s;
  }
  .sidebar a:hover { color: #111; }
  .sidebar a.active { color: #111; font-weight: 600; }

  .sidebar-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: #888;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  .sidebar-close:hover { color: #111; }

  /* Mobile */
  @media (max-width: 520px) {
    header { padding-top: 32px; }
    .container { padding: 0 16px; }
    .archive-entry { gap: 12px; }
    .archive-entry-date { min-width: 40px; }
    .archive-entry-title { font-size: 14px; }
    .archive-entry-category { display: none; }
    .sidebar-toggle { bottom: 20px; right: 20px; }
    .sidebar { width: 260px; right: -260px; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="site-title">WAFILOG</a>
  <nav>
    <a href="/">首页</a>
    <a href="/archives/" class="active">归档</a>
    <a href="/friends/">友链</a>
  </nav>
</header>

<main class="container">
  <h1 class="page-title">归档</h1>

  <div class="archive-year">
    <h2 class="year-heading">2026</h2>

    <div class="archive-month" id="2026-08">
      <h3 class="month-heading">8月</h3>

      <div class="archive-entry">
        <span class="archive-entry-date">08-16</span>
        <span class="archive-entry-title">
          <a href="/2026/08/16/WHY_Wired/">起源引擎的怪异感从何而来</a>
        </span>
        <span class="archive-entry-category">WafiWHY</span>
      </div>

      <div class="archive-entry">
        <span class="archive-entry-date">08-16</span>
        <span class="archive-entry-title">
          <a href="/2026/08/16/SKYBOX/">天空盒之外的世界</a>
        </span>
        <span class="archive-entry-category">胡思乱想</span>
      </div>

      <div class="archive-entry">
        <span class="archive-entry-date">08-15</span>
        <span class="archive-entry-title">
          <a href="/2026/08/15/Why_Neuro/">为什么是Neuro</a>
        </span>
        <span class="archive-entry-category">WafiWHY</span>
      </div>

      <div class="archive-entry">
        <span class="archive-entry-date">08-15</span>
        <span class="archive-entry-title">
          <a href="/2026/08/15/INTERLOPER/">INTERLOPER ARG 完整解析</a>
        </span>
        <span class="archive-entry-category">ARG 解析</span>
      </div>

      <div class="archive-entry">
        <span class="archive-entry-date">08-12</span>
        <span class="archive-entry-title">
          <a href="https://miwafi.github.io/2026/08/12/Driverdevelop/#more">Windows内核驱动食用教程</a>
        </span>
        <span class="archive-entry-category">教程</span>
      </div>
    </div>

    <div class="archive-month" id="2026-07">
      <h3 class="month-heading">7月</h3>

      <div class="archive-entry">
        <span class="archive-entry-date">07-27</span>
        <span class="archive-entry-title">
          <a href="https://miwafi.github.io/2026/07/27/SourceVRAD/#more">追寻起源引擎的光与影</a>
        </span>
        <span class="archive-entry-category">技术调查</span>
      </div>
    </div>
  </div>

  <div class="archive-stats">
    共 6 篇文章
  </div>
</main>

<footer class="container">
  WafiLog
</footer>

<!-- Sidebar Toggle -->
<button class="sidebar-toggle" id="sidebarToggle" aria-label="打开侧边栏">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="4" y1="6" x2="20" y2="6"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="18" x2="20" y2="18"/>
  </svg>
</button>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">✕</button>
  <h3>归档</h3>
  <ul>
    <li><a href="/archives/#2026-08">2026 年 8 月</a></li>
    <li><a href="/archives/#2026-07">2026 年 7 月</a></li>
  </ul>
</aside>

<script>
  (function() {
    var toggle = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var close = document.getElementById('sidebarClose');

    function open() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    toggle.addEventListener('click', open);
    close.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
  })();

</script>

</body>
</html>
